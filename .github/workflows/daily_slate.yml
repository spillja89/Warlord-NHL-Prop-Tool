name: Build daily slate (tracker_latest)

on:
  schedule:
    - cron: "5 11 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-repository-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: America/Chicago
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            data/cache
          key: cache-${{ runner.os }}-${{ hashFiles('nhl_edge.py', 'odds_ev_bdl.py') }}
          restore-keys: |
            cache-${{ runner.os }}-

      - name: Build tracker (edge)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          echo "Local date (TZ=$TZ): $(date -I)"
          python nhl_edge.py --date "$(date -I)" --allow-no-games
          echo ""
          echo "After nhl_edge.py, output/:"
          ls -lah output || true

      - name: Pin tracker_latest.csv (canonical output)
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -I)"
          latest_edge="$(ls -1t "output/tracker_${today}_"*.csv 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_edge" ]; then
            echo "No tracker was produced for $today; keeping the previous saved slate"
            exit 0
          fi
          if [ "$(wc -l < "$latest_edge")" -le 1 ]; then
            echo "No player rows for $today; keeping the previous saved slate"
            exit 0
          fi
          cp "$latest_edge" output/tracker_latest.csv
          python freeze_daily_slate.py --date "$today" --tracker "$latest_edge" --output "output/slates/tracker_${today}.csv"
          echo "Pinned $latest_edge -> output/tracker_latest.csv"

      - name: Commit & push tracker_latest.csv
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f output/tracker_latest.csv ]; then
            git add -f output/tracker_latest.csv
          fi
          today_snapshot="output/slates/tracker_$(date -I).csv"
          if [ -f "$today_snapshot" ]; then
            git add -f "$today_snapshot"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily slate: tracker_latest"
          git pull --rebase
          git push
