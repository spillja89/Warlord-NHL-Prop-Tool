name: Grade completed NHL slates

on:
  schedule:
    # Avoid the busiest minute of the hour; keep local time through DST.
    - cron: "7 7 * * *"
      timezone: America/Chicago
    # A second morning pass catches late finals or a delayed/missed first pass.
    - cron: "17 8 * * *"
      timezone: America/Chicago
  workflow_dispatch:
  # Verify the actual hosted job whenever its configuration is maintained.
  # The job writes the preview branch, so it cannot trigger itself.
  push:
    branches: [main]
    paths: [.github/workflows/grade_previous_slate.yml]

permissions:
  contents: write

concurrency:
  group: nhl-repository-writes
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Chicago
    steps:
      - name: Check out the live preview branch
        uses: actions/checkout@v4
        with:
          ref: launch/2026-warlord-readiness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Preserve move identities and the current slate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from card_returns import FILES
          from card_return_store import _identity

          snapshot = {
              'moves': {name: _identity(json.loads(Path(name).read_text(encoding='utf-8'))) for name in FILES},
              'protected': {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in [*Path('.').glob('*.py'), *Path('output/slates').glob('*.csv'), Path('output/tracker_latest.csv')]
                  if path.is_file()
              },
          }
          (Path(os.environ['RUNNER_TEMP']) / 'nhl-grader-before.json').write_text(json.dumps(snapshot), encoding='utf-8')
          PY

      - name: Grade yesterday and retry recent slates
        shell: bash
        run: |
          set -euo pipefail
          for days_ago in 1 2 3; do
            slate_date="$(date -d "$days_ago days ago" +%F)"
            python grade_daily_tracker.py --date "$slate_date" --skip-missing
          done
          python card_returns.py

      - name: Validate unchanged rules and updated returns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from card_returns import FILES
          from card_return_store import _identity, validate_bundle

          before = json.loads((Path(os.environ['RUNNER_TEMP']) / 'nhl-grader-before.json').read_text(encoding='utf-8'))
          now = {name: _identity(json.loads(Path(name).read_text(encoding='utf-8'))) for name in FILES}
          # JSON normalizes tuple identities into arrays in the saved snapshot.
          if json.loads(json.dumps(now)) != before['moves']:
              raise SystemExit('Move rules or original version baselines changed; refusing publication')
          for filename, expected in before['protected'].items():
              if hashlib.sha256(Path(filename).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'Protected model/slate file changed: {filename}; refusing publication')
          bundle = validate_bundle(json.loads(Path('output/card_returns/latest.json').read_text(encoding='utf-8')), Path('.'))
          manifest = bundle['manifest']
          rows = [move for doc in bundle['records'].values() for move in doc['moves']]
          for move in rows:
              parts = [move[period] for period in ('previous', 'since_check', 'full')]
              if all(part.get('units') is not None for part in parts):
                  if abs(parts[0]['units'] + parts[1]['units'] - parts[2]['units']) > 1e-7:
                      raise SystemExit(f'Overlapping or incorrect return units: {move["name"]}')
          summary = (
              '## Morning NHL grading\n'
              f'- Graded through: **{manifest["through"]}**\n'
              f'- Move records checked: **{len(rows)}**\n'
              '- Rules and original version baselines: unchanged\n'
              '- Current tracker and frozen pregame archives: unchanged\n'
              '- Unfinished games and missing player results: remain unresolved\n'
              '- No odds/model refresh or app restart performed\n'
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          print(summary)
          PY

      - name: Save graded results and updated card returns
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          results=(output/graded/tracker_*_GRADED.csv output/graded/tracker_*_summary.json output/graded/moves_*.csv output/card_returns/*.json goal_return_records.json assist_return_records.json points_return_records.json special_return_records.json)
          if (( ${#results[@]} )); then
            git add -f "${results[@]}"
          fi
          if git diff --cached --quiet; then
            echo 'No grading changes'
            exit 0
          fi
          git commit -m 'Grade completed NHL slates and refresh card returns'
          git pull --rebase origin launch/2026-warlord-readiness
          git push origin HEAD:launch/2026-warlord-readiness
