name: Freeze and grade Warlord preview slates

on:
  schedule:
    # Morning captures early lines; afternoon refreshes games that have not started.
    - cron: "20 11 * * *"
    - cron: "45 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-repository-writes
  cancel-in-progress: false

jobs:
  forward-slate:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Check out the live preview branch
        uses: actions/checkout@v4
        with:
          ref: launch/2026-warlord-readiness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            data/cache
          key: forward-cache-${{ runner.os }}-${{ hashFiles('nhl_edge.py', 'odds_ev_bdl.py') }}
          restore-keys: forward-cache-${{ runner.os }}-

      - name: Build and preserve today's pregame slate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BALLDONTLIE_API_KEY" ]]; then
            echo "::error::BALLDONTLIE_API_KEY is missing from repository Actions secrets"
            exit 1
          fi
          today="$(date +%F)"
          python nhl_edge.py --date "$today" --allow-no-games
          latest_edge="$(ls -1t "output/tracker_${today}_"*.csv 2>/dev/null | head -n 1 || true)"
          if [[ -z "$latest_edge" ]]; then
            echo "No tracker for $today; preserving the previous published slate"
            exit 0
          fi
          if python - "$latest_edge" "$today" <<'PY'
          import sys
          import pandas as pd

          frame = pd.read_csv(sys.argv[1], low_memory=False)
          if frame.empty or set(frame['Date'].astype(str)) != {sys.argv[2]}:
              raise SystemExit('Tracker is empty or has the wrong date')
          markets = ['Points', 'Assists', 'SOG', 'Goal', 'ATG']
          priced = sum(
              (frame[f'{market}_Line'].notna() & frame[f'{market}_Odds_Over'].notna()).sum()
              for market in markets
              if {f'{market}_Line', f'{market}_Odds_Over'}.issubset(frame.columns)
          )
          if not priced:
              print('No posted player lines yet; preserving the previous published slate')
              sys.exit(2)
          print(f'{len(frame)} player rows; {priced} posted market lines')
          PY
          then
            :
          else
            status=$?
            if [[ "$status" -eq 2 ]]; then
              exit 0
            fi
            exit "$status"
          fi
          python freeze_daily_slate.py --date "$today" --tracker "$latest_edge" --output "output/slates/tracker_${today}.csv"
          if [[ ! -f "output/slates/tracker_${today}.csv" ]]; then
            echo "No future games to freeze; preserving the previous published slate"
            exit 0
          fi
          cp "$latest_edge" output/tracker_latest.csv
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f output/tracker_latest.csv "output/slates/tracker_${today}.csv"
          if ! git diff --cached --quiet; then
            git commit -m "Freeze pregame NHL slate for $today"
            git pull --rebase origin launch/2026-warlord-readiness
            git push origin HEAD:launch/2026-warlord-readiness
          fi

      - name: Grade recent frozen slates from final box scores
        shell: bash
        run: |
          set -euo pipefail
          for days_ago in 1 2 3; do
            slate_date="$(date -d "$days_ago days ago" +%F)"
            python grade_daily_tracker.py --date "$slate_date" --skip-missing
          done
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          results=(output/graded/tracker_*_GRADED.csv output/graded/tracker_*_summary.json output/graded/moves_*.csv)
          if (( ${#results[@]} )); then
            git add -f "${results[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Grade completed NHL slates'
            git pull --rebase origin launch/2026-warlord-readiness
            git push origin HEAD:launch/2026-warlord-readiness
          fi
